services:
  - type: worker
    name: cinevault-autofilter-v3
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ADMINS
        sync: false
      - key: FORCE_SUB_CHANNELS
        value: ""
